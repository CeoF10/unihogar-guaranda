<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habitación en 3D</title>
<style>
  * { box-sizing:border-box }
  html,body { margin:0; overflow:hidden; background:#eae5db; color:#2e261e; font:16px system-ui,sans-serif }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none }
  header { position:fixed; top:12px; left:12px; max-width:calc(100vw - 24px); display:grid; gap:6px; justify-items:start; pointer-events:none }
  header span, #missing { background:#f8f4eb; padding:4px 10px; border-radius:9px; font-size:12px; font-weight:650; color:#5b4b3c }
  #missing { color:#8a3b1e }
  footer { position:fixed; inset:auto 12px 12px; display:grid; justify-items:center; gap:7px; pointer-events:none }
  footer small { background:#f8f4eb; padding:4px 10px; border-radius:9px }
  nav { pointer-events:auto; display:flex; flex-wrap:wrap; justify-content:center; gap:5px; padding:5px;
    background:#f8f4eb; border:1px solid #b8a995; border-radius:12px }
  button { min-height:44px; min-width:44px; padding:0 11px; border:1px solid transparent; border-radius:8px;
    background:#f8f4eb; color:#2e261e; font:650 13px system-ui,sans-serif }
  button[aria-pressed=true] { background:#352a20; color:#fff7ea }
  button:focus-visible,canvas:focus-visible { outline:2px solid #936128; outline-offset:-3px }
  #error { position:fixed; inset:0; display:grid; place-items:center; padding:28px; text-align:center; background:#eae5db }
  [hidden] { display:none!important }
  /* En horizontal los controles pasan a una columna lateral para no tapar el cuarto. */
  @media (orientation:landscape) and (max-height:520px) {
    footer { inset:12px 12px 12px auto; align-content:end; justify-items:end }
    nav { flex-direction:column; flex-wrap:nowrap }
    footer small { display:none }
  }
</style>
<canvas tabindex="0"></canvas>
<header><span id="summary">Modelo ilustrativo</span><span id="missing" hidden></span></header>
<footer>
  <small>Arrastra para mover la cámara · pellizca para acercar</small>
  <nav aria-label="Controles de la habitación">
    <button id="orbit" aria-pressed="true">Vista general</button>
    <button id="inside" aria-pressed="false">Entrar</button>
    <button id="minus" aria-label="Alejar">−</button>
    <button id="plus" aria-label="Acercar">+</button>
    <button id="reset">Centrar</button>
  </nav>
</footer>
<div id="error" role="status" hidden>Este dispositivo no pudo mostrar el modelo 3D. Puedes volver a la ficha y abrir la galería.</div>
<script src="room-3d.js" defer></script>
</html>
