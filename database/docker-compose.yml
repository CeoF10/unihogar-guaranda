services:
  postgres:
    image: postgres:16-alpine
    container_name: unihogar_postgres
    restart: always
    environment:
      POSTGRES_DB: unihogar_db
      POSTGRES_USER: unihogar_user
      POSTGRES_PASSWORD: unihogar_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
